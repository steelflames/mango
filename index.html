{id:1,n:"The Hundred",t:{position:["Supine"],goal:["Stabilize","Endure"],region:["Core/Trunk"],modality:["Mat"],props:["None"],stability:["Anti-Extension"],pattern:["Spinal Articulation"],chain:["Anterior","Deep Stabilizers"],control:["Moderate"],joint:["Spinal Segmentation"],dysfunction:["Rib Flare","Anterior Pelvic Tilt"],precaution:["Cervical","Osteoporosis"]},cu:"From supine, curl head and shoulders off the mat. Extend legs to 45\u00B0 (or tabletop). Pump arms up and down vigorously at hip height while breathing 5 counts in, 5 counts out. Maintain deep abdominal scoop and neutral pelvis for 100 beats.",cc:"Scoop and pump",no:"Breath-driven endurance. Watch for neck tension and rib flare.",pr:[{id:"p1",n:"Imprint breathing \u2014 supine, arms at sides, practice 5-in/5-out without lifting"},{id:"p2",n:"Head nod + chest lift only \u2014 no arm pump, legs stay down"},{id:"p3",n:"Chest lift + arm pump \u2014 feet flat on floor"},{id:"p4",n:"Tabletop legs + pump \u2014 90\u00B0 hip/knee"},{id:"p5",n:"Full Hundred \u2014 legs extended 45\u00B0, full 100 beats"}],vr:[{id:"v1",n:"Feet on floor (regression)"},{id:"v2",n:"Legs to ceiling (less demand)"},{id:"v3",n:"Magic Circle between ankles"}]},
{id:2,n:"Roll Up",t:{position:["Supine"],goal:["Articulate","Lengthen"],region:["Spine","Core/Trunk"],modality:["Mat"],props:["None"],stability:["Dynamic Stability"],pattern:["Spinal Articulation"],chain:["Anterior"],control:["Moderate"],joint:["Spinal Segmentation"],dysfunction:["Thoracic Kyphosis","Lumbar Hypermobility"],precaution:["Disc","Osteoporosis"]},cu:"From supine with arms overhead, nod chin and sequentially peel each vertebra off the mat, reaching forward past the toes in a deep C-curve. Reverse the motion, placing one vertebra at a time back down, arms reaching overhead to return to start.",cc:"Peel and reach",no:"Articulation is the priority, not speed. Watch for flat-back lifting.",pr:[{id:"p1",n:"Head nod + chin tuck \u2014 feel deep neck flexors engage"},{id:"p2",n:"Chest lift to shoulder blades \u2014 curl up, lower with control"},{id:"p3",n:"Half roll back from seated \u2014 roll to sacrum, return up"},{id:"p4",n:"Full Roll Up with band assist"},{id:"p5",n:"Full Roll Up \u2014 sequential articulation both directions"}],vr:[{id:"v4",n:"Band-assisted Roll Up"},{id:"v5",n:"Arms by ears (harder lever)"}]},
{id:3,n:"Single Leg Circle",t:{position:["Supine"],goal:["Stabilize","Mobilize"],region:["Hip/Pelvis","Core/Trunk"],modality:["Mat"],props:["None"],stability:["Anti-Rotation"],pattern:["Single Leg","Hip Hinge"],chain:["Deep Stabilizers","Lateral"],control:["Moderate"],joint:["Hip Dissociation","Femoral Glide"],dysfunction:["Lateral Hip Weakness","Anterior Pelvic Tilt"],precaution:["SI Joint"]},cu:"From supine with one leg extended to ceiling, circle the leg across the body, down, out, and back to center. The pelvis remains completely still throughout. Reverse direction. Opposite leg stays long on the mat anchoring the hips.",cc:"Circle, anchor hips",no:"Focus on pelvic stability over circle size.",pr:[{id:"p1",n:"Bent knee drops \u2014 knee falls to side, pelvis stays level"},{id:"p2",n:"Bent knee small circles \u2014 foot off floor, tiny circles"},{id:"p3",n:"Straight leg, small circles \u2014 reduced range"},{id:"p4",n:"Full leg circles \u2014 both directions, pelvis anchored"}],vr:[{id:"v6",n:"Band around foot for feedback"}]},

{id:7,n:"Spine Stretch",t:{position:["Seated"],goal:["Articulate","Lengthen"],region:["Spine","Core/Trunk"],modality:["Mat"],props:["None"],stability:["Dynamic Stability"],pattern:["Spinal Articulation"],chain:["Posterior","Deep Stabilizers"],control:["Low"],joint:["Spinal Segmentation"],dysfunction:["Thoracic Kyphosis","Lumbar Hypermobility"],precaution:[]},cu:"Seated tall with legs apart and feet flexed, grow taller through the crown. Nod the chin and round forward sequentially, reaching past the feet while scooping the belly back. Restack the spine from the base, rebuilding to tall seated position.",cc:"Lift then fold",no:"Flexion with length, not collapse.",pr:[{id:"p1",n:"Seated tall breathing \u2014 sit tall, breathe into back ribs"},{id:"p2",n:"Nod and round to C7 \u2014 just the head and upper thoracic"},{id:"p3",n:"Full Spine Stretch \u2014 complete round forward and rebuild"}],vr:[]},
{id:8,n:"Swan",t:{position:["Prone"],goal:["Strengthen","Mobilize"],region:["Spine","Shoulder/Scap"],modality:["Mat"],props:["None"],stability:["Anti-Extension"],pattern:["Push","Spinal Articulation"],chain:["Posterior"],control:["Moderate"],joint:["Scapulohumeral Rhythm","Thoracic Rotation"],dysfunction:["Thoracic Kyphosis","Scapular Winging"],precaution:["Disc","Stenosis"]},cu:"From prone with hands by shoulders, draw shoulder blades down the back and press through hands to lift the chest into thoracic extension. Keep the neck long as a continuation of the spine. Lower with control, leading with the sternum.",cc:"Long spine, open chest",no:"Extension should come from thoracic, not lumbar.",pr:[{id:"p1",n:"Prone press \u2014 forearms down, lift sternum 1 inch, lower"},{id:"p2",n:"Baby Swan \u2014 hands press, elbows stay bent, mid-back extension"},{id:"p3",n:"Full Swan \u2014 arms straighten, full thoracic extension"}],vr:[{id:"v7",n:"Swan on foam roller"},{id:"v8",n:"Swan dive (rocking)"}]},
{id:9,n:"Side Kick Series",t:{position:["Side-lying"],goal:["Stabilize","Strengthen"],region:["Hip/Pelvis","Core/Trunk"],modality:["Mat"],props:["None"],stability:["Anti-Lateral Flexion","Anti-Rotation"],pattern:["Single Leg","Gait Prep"],chain:["Lateral","Deep Stabilizers"],control:["Moderate"],joint:["Hip Dissociation"],dysfunction:["Lateral Hip Weakness","Knee Valgus"],precaution:["SI Joint"]},cu:"From side-lying with hips stacked and body in one long line, lift the top leg to hip height. Swing the leg forward with a double pulse, then sweep it back into extension. The trunk remains completely stable throughout \u2014 no rocking forward or back.",cc:"Stable trunk, move hip",no:"The trunk is the test. If it\u2019s moving, reduce range.",pr:[{id:"p1",n:"Side-lying alignment hold \u2014 stack and sustain without sinking"},{id:"p2",n:"Top leg lift + lower \u2014 hip height only, no swing"},{id:"p3",n:"Small front/back \u2014 reduced range, pelvis stacked"},{id:"p4",n:"Full Side Kick Series \u2014 all directions with stable trunk"}],vr:[]},
{id:10,n:"Teaser",t:{position:["Supine"],goal:["Strengthen","Balance"],region:["Core/Trunk","Full Body"],modality:["Mat"],props:["None"],stability:["Dynamic Stability"],pattern:["Spinal Articulation"],chain:["Anterior","Deep Stabilizers"],control:["High"],joint:["Spinal Segmentation","Hip Dissociation"],dysfunction:["Anterior Pelvic Tilt","Poor Balance"],precaution:["Disc"]},cu:"From supine with arms overhead and legs together, simultaneously roll up through the spine and lift legs to 45\u00B0, reaching arms parallel to legs. Balance in a V-shape at the sit bones. Lower legs and torso back down with control, rolling through each vertebra.",cc:"Roll up, find the V",no:"Quintessential Pilates. The whole body moves as one unit. Control is everything.",pr:[{id:"p1",n:"Chest lift with reach \u2014 arms reach to knees, feet stay down"},{id:"p2",n:"Roll back to sacrum \u2014 from seated, roll back halfway, return"},{id:"p3",n:"Single leg Teaser \u2014 one foot down, roll up to meet extended leg"},{id:"p4",n:"Both feet down Teaser \u2014 roll up to V with feet on floor"},{id:"p5",n:"Full Teaser \u2014 arms and legs move simultaneously"}],vr:[{id:"v9",n:"Teaser with magic circle"},{id:"v10",n:"Teaser 2 (arms only move)"},{id:"v11",n:"Teaser 3 (everything lowers/lifts)"}]},
{id:12,n:"Swimming",t:{position:["Prone"],goal:["Endure","Coordinate"],region:["Spine","Full Body"],modality:["Mat"],props:["None"],stability:["Anti-Extension","Anti-Rotation"],pattern:["Gait Prep"],chain:["Posterior"],control:["High"],joint:["Scapulohumeral Rhythm","Hip Dissociation"],dysfunction:["Scapular Winging","Thoracic Kyphosis"],precaution:["Disc","Stenosis"]},cu:"From prone with arms extended overhead, lift chest and limbs off the mat. Flutter opposite arm and leg in a continuous swimming motion, alternating quickly. Keep the torso lifted and stable while limbs move from the shoulders and hips. Breathe every 5 counts.",cc:"Flutter, stay lifted",no:"Contralateral coordination from a stable extension.",pr:[{id:"p1",n:"Prone single arm lift \u2014 one arm lifts, everything else stays"},{id:"p2",n:"Prone single leg lift \u2014 one leg lifts without pelvis rocking"},{id:"p3",n:"Contralateral hold \u2014 right arm + left leg, hold 5 sec, switch"},{id:"p4",n:"Slow Swimming \u2014 deliberate alternation with pause"},{id:"p5",n:"Full Swimming \u2014 continuous flutter, 20-30 beats"}],vr:[]},
{id:13,n:"Shoulder Bridge",t:{position:["Supine"],goal:["Strengthen","Articulate"],region:["Hip/Pelvis","Spine"],modality:["Mat"],props:["None"],stability:["Anti-Rotation","Anti-Extension"],pattern:["Hip Hinge"],chain:["Posterior","Deep Stabilizers"],control:["Moderate"],joint:["Spinal Segmentation","Femoral Glide"],dysfunction:["Anterior Pelvic Tilt","Lateral Hip Weakness"],precaution:["Cervical"]},cu:"From supine with knees bent and feet flat, tilt the pelvis and peel the spine off the mat one vertebra at a time until weight rests on the shoulder blades. Hold at the top with hips level, then roll down through the spine bone by bone, placing each vertebra sequentially.",cc:"Press feet, peel hips",no:"Articulation up AND down. Watch for rib thrust at the top.",pr:[{id:"p1",n:"Pelvic tilt \u2014 imprint and release, feel deep low abs"},{id:"p2",n:"Bridge to mid-back \u2014 peel up to bra line, roll down"},{id:"p3",n:"Full bridge \u2014 all the way to shoulders, roll down"},{id:"p4",n:"Single leg bridge \u2014 extend one leg at top, lower and lift hip"}],vr:[{id:"v12",n:"Feet on ball"},{id:"v13",n:"Band around thighs"}]},
{id:14,n:"Mermaid",t:{position:["Seated"],goal:["Mobilize","Lengthen"],region:["Spine","Core/Trunk"],modality:["Mat","Reformer"],props:["None"],stability:["Anti-Lateral Flexion"],pattern:["Rotation"],chain:["Lateral"],control:["Low"],joint:["Thoracic Rotation","Spinal Segmentation"],dysfunction:["Thoracic Kyphosis"],precaution:[]},cu:"From seated with legs folded to one side, reach the top arm overhead and laterally flex the spine, lengthening through the side body. Place the bottom hand on the mat for support. Return to center with control, then add rotation toward the floor if appropriate.",cc:"Reach up and over",no:"Lateral flexion with length, not side-crunch.",pr:[{id:"p1",n:"Seated side reach \u2014 arm overhead, small lean"},{id:"p2",n:"Mermaid with hand support \u2014 full side bend, hand on floor"},{id:"p3",n:"Mermaid with rotation \u2014 add twist toward floor, unwind"}],vr:[]},
{id:15,n:"Cat-Cow",t:{position:["Quadruped"],goal:["Mobilize","Articulate"],region:["Spine"],modality:["Mat"],props:["None"],stability:["Dynamic Stability"],pattern:["Spinal Articulation"],chain:["Anterior","Posterior"],control:["Low"],joint:["Spinal Segmentation","Pelvic Clock"],dysfunction:["Thoracic Kyphosis","Lumbar Hypermobility"],precaution:[]},cu:"From hands and knees with wrists under shoulders and knees under hips, tuck the pelvis and round the spine toward the ceiling sequentially from tail to crown (Cat). Then reverse, dropping the belly, lifting the tailbone and head, opening the chest (Cow). Move with breath, one vertebra at a time.",cc:"Breathe into segments",no:"Foundational spinal warm-up. Cue segmental movement, not global flexion/extension.",pr:[{id:"p1",n:"Quadruped neutral hold \u2014 find neutral spine, hold and breathe"},{id:"p2",n:"Pelvic tilt only \u2014 move from the pelvis, let it ripple up"},{id:"p3",n:"Full Cat-Cow \u2014 sequential wave, tail to crown"}],vr:[{id:"v1",n:"Single-Leg Cat Cow"},{id:"v2",n:"Lateral Cat"}]},
{id:16,n:"Standing Roll Down",t:{position:["Standing"],goal:["Articulate","Lengthen"],region:["Spine","Core/Trunk"],modality:["Mat"],props:["None"],stability:["Dynamic Stability"],pattern:["Spinal Articulation","Hip Hinge"],chain:["Posterior"],control:["Low"],joint:["Spinal Segmentation"],dysfunction:["Thoracic Kyphosis"],precaution:[]},cu:"From standing tall, nod the chin and sequentially roll down through each vertebra \u2014 cervical, thoracic, lumbar \u2014 letting the arms and head hang heavy. Pause at the bottom, then rebuild the spine from the base, restacking each vertebra until standing tall again.",cc:"Nod, peel, rebuild",no:"Gravity-assisted opener. Great for beginning or end of class.",pr:[{id:"p1",n:"Wall roll down \u2014 back against wall, peel away segment by segment"},{id:"p2",n:"Half roll down \u2014 stop at ribcage, rebuild"},{id:"p3",n:"Full roll down \u2014 all the way to floor, full rebuild"}],vr:[]},

{id:18,n:"Plank to Pike",t:{position:["Quadruped"],goal:["Strengthen","Coordinate"],region:["Core/Trunk","Full Body"],modality:["Mat","Reformer"],props:["None"],stability:["Anti-Extension","Dynamic Stability"],pattern:["Push"],chain:["Anterior","Deep Stabilizers"],control:["High"],joint:["Scapulohumeral Rhythm","Spinal Segmentation"],dysfunction:["Rib Flare","Scapular Winging"],precaution:["Shoulder Impingement"]},cu:"From a long plank position with hands under shoulders and body in one straight line, hinge at the hips to lift into an inverted V (pike), keeping legs straight and pressing chest toward thighs. Return to plank with control, maintaining a strong center throughout.",cc:"Strong center, pike up",no:"Full body integration. Plank quality matters more than pike depth.",pr:[{id:"p1",n:"Plank hold \u2014 30-60 seconds, ribs in, no sag"},{id:"p2",n:"Knee tucks from plank \u2014 draw knees to chest, return"},{id:"p3",n:"Half pike \u2014 small hip hinge, knees can bend"},{id:"p4",n:"Full pike \u2014 straight legs, full inverted V"}],vr:[]},
{id:19,n:"Bird Dog",t:{position:["Quadruped"],goal:["Stabilize","Coordinate"],region:["Core/Trunk","Hip/Pelvis","Shoulder/Scap"],modality:["Mat"],props:["None"],stability:["Anti-Rotation","Anti-Extension"],pattern:["Gait Prep","Single Leg"],chain:["Posterior","Deep Stabilizers"],control:["Moderate"],joint:["Hip Dissociation","Scapulohumeral Rhythm"],dysfunction:["Anterior Pelvic Tilt","Lateral Hip Weakness","Poor Balance"],precaution:[]},cu:"From hands and knees, simultaneously extend the right arm forward and left leg back, creating one long line from fingertips to toes. Hold briefly without letting the pelvis shift or rotate, then return with control. Alternate sides.",cc:"Reach long, don\u2019t shift",no:"Contralateral stability. The challenge is NOT moving what shouldn\u2019t move.",pr:[{id:"p1",n:"Single arm lift only \u2014 from quadruped, extend one arm without shifting"},{id:"p2",n:"Single leg extend only \u2014 extend one leg without pelvis rotating"},{id:"p3",n:"Contralateral reach \u2014 opposite arm and leg together"},{id:"p4",n:"Bird Dog with slow lower \u2014 5 count extend, 5 count return"}],vr:[{id:"v14",n:"Bird Dog on foam roller (challenge balance)"}]},
